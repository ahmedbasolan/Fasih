# production-release.yml
#
# Manual release workflow. Trigger from the EAS dashboard or with:
#   eas workflow:run production-release
#
# Steps (all run in parallel where possible):
#   1. Typecheck + tests    — gate before spending build minutes
#   2. iOS build            — production profile → App Store
#   3. Android build        — production profile → Google Play
#   4. Submit iOS           — after iOS build completes
#   5. Submit Android       — after Android build completes
#   6. Production OTA       — publish JS update to `production` channel
#
# Required EAS Environment Variables (set in EAS dashboard → Environment Variables):
#   EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY   (production)
#   EXPO_PUBLIC_SUPABASE_URL            (production)
#   EXPO_PUBLIC_SUPABASE_ANON_KEY       (production)
#   EXPO_PUBLIC_SENTRY_DSN              (production)
#   SENTRY_AUTH_TOKEN                   (production — build-time only, source map/debug symbol upload; NOT EXPO_PUBLIC_)
#   EXPO_PUBLIC_REVENUECAT_IOS_KEY      (production)
#   EXPO_PUBLIC_REVENUECAT_ANDROID_KEY  (production)

name: Production Release

on:
  workflow_dispatch:
    inputs:
      message:
        description: Release notes (shown in EAS dashboard)
        required: true
        default: "Production release"

jobs:
  # ─── Gate: typecheck + tests must pass before any builds start ───────────────
  typecheck:
    name: TypeScript
    runs_on: linux-medium
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Run tsc
        run: npx tsc --noEmit

  test:
    name: Unit Tests
    runs_on: linux-medium
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Run Jest
        run: npm test -- --ci --forceExit

  # ─── Native builds (parallel, both gated on typecheck+test) ──────────────────
  build_ios:
    name: Build iOS
    type: build
    needs: [typecheck, test]
    environment: production
    params:
      platform: ios
      profile: production
      message: ${{ inputs.message }}

  build_android:
    name: Build Android
    type: build
    needs: [typecheck, test]
    environment: production
    params:
      platform: android
      profile: production
      message: ${{ inputs.message }}

  # ─── Store submissions (each waits for its own build) ────────────────────────
  # Platform is inferred from the build; profile maps to the submit config in eas.json.
  submit_ios:
    name: Submit to App Store
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  submit_android:
    name: Submit to Google Play
    type: submit
    needs: [build_android]
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  # ─── OTA update for existing installs ────────────────────────────────────────
  # Existing users get the JS bundle immediately; new installs get it via the build.
  publish_update:
    name: Publish Production OTA Update
    type: update
    needs: [typecheck, test]
    environment: production
    params:
      channel: production
      message: ${{ inputs.message }}
